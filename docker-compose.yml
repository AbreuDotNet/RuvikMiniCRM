# Local production-shaped stack: real PostgreSQL, real Redis, API and worker
# as separate processes so horizontal scaling is exercised the way it runs
# in production.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ruvik
      POSTGRES_PASSWORD: ruvik_local_dev
      POSTGRES_DB: ruvik
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ruvik -d ruvik']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    # Without a policy a crashed container simply stays down. Not `always`:
    # that would fight `docker compose stop` on the next daemon start.
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://ruvik:ruvik_local_dev@postgres:5432/ruvik?sslmode=disable
      REDIS_URL: redis://redis:6379
      API_BASE_URL: http://localhost:4000
      WEB_BASE_URL: http://localhost:5173
      # Local-only values. In production these come from the secrets manager.
      JWT_ACCESS_SECRET: local-dev-jwt-secret-value-at-least-32-chars
      ENCRYPTION_KEY: local-dev-encryption-key-at-least-32-chars
      HASH_PEPPER: local-dev-hash-pepper-16
      BILLING_WEBHOOK_SECRET: local-dev-billing-webhook-secret
      # The API serves requests; the worker drains the queue.
      WORKER_MODE: external
    ports: ['4000:4000']
    volumes: ['storage:/app/storage']

  worker:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ['node', 'apps/api/dist/workers/runner.js']
    restart: unless-stopped
    # The image's HEALTHCHECK probes the API's port, which the worker does not
    # serve. It now runs its own liveness endpoint reporting whether the poll
    # loop is still turning — a live process with a wedged loop reads as
    # unhealthy here, which is the whole point.
    # Each container has its own network namespace, so 127.0.0.1:4001 stays
    # per-replica under `--scale worker=3`.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 4s
      start_period: 20s
      retries: 3
    environment:
      NODE_ENV: production
      WORKER_HEALTH_PORT: 4001
      DATABASE_URL: postgres://ruvik:ruvik_local_dev@postgres:5432/ruvik?sslmode=disable
      REDIS_URL: redis://redis:6379
      API_BASE_URL: http://localhost:4000
      WEB_BASE_URL: http://localhost:5173
      JWT_ACCESS_SECRET: local-dev-jwt-secret-value-at-least-32-chars
      ENCRYPTION_KEY: local-dev-encryption-key-at-least-32-chars
      HASH_PEPPER: local-dev-hash-pepper-16
      BILLING_WEBHOOK_SECRET: local-dev-billing-webhook-secret
    volumes: ['storage:/app/storage']
    # Scale the queue independently of the API: docker compose up --scale worker=3
    deploy:
      replicas: 1

volumes:
  pgdata:
  storage:
